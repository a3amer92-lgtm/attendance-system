# نشر بضغطة واحدة على Render من مستودع جيت هاب (Blueprint)
services:
  - type: web
    name: attendance-system
    runtime: docker
    plan: starter            # القرص الدائم مش متاح في الخطة المجانية
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ACCESS_PASSWORD
        sync: false          # هتكتبها بنفسك في لوحة Render
      - key: TZ_NAME
        value: Africa/Cairo
