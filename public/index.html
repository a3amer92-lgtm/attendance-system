<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>الحضور والانصراف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#1b2333;--mut:#667085;--bd:#e3e7ee;--pr:#2456d6;--prs:#e8effd;--ok:#12805c;--oks:#e2f5ee;--wa:#a76100;--was:#fff1d6;--er:#c22b3a;--ers:#fde7ea;--in:#1d6fa5;--ins:#e0f0fa;--gr:#5b6577;--grs:#eceff4;--or:#a04a00;--ors:#ffe9d9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141d;--card:#182030;--tx:#e8ecf4;--mut:#93a0b8;--bd:#2a3549;--pr:#6c93ff;--prs:#1f2c4d;--ok:#4cd3a0;--oks:#12332a;--wa:#f3b955;--was:#3a2d12;--er:#ff7a88;--ers:#3d1a20;--in:#6cc0f0;--ins:#14303f;--gr:#a5afc2;--grs:#26304a;--or:#ffa15c;--ors:#3d2410}}
:root[data-theme="dark"]{--bg:#0f141d;--card:#182030;--tx:#e8ecf4;--mut:#93a0b8;--bd:#2a3549;--pr:#6c93ff;--prs:#1f2c4d;--ok:#4cd3a0;--oks:#12332a;--wa:#f3b955;--was:#3a2d12;--er:#ff7a88;--ers:#3d1a20;--in:#6cc0f0;--ins:#14303f;--gr:#a5afc2;--grs:#26304a;--or:#ffa15c;--ors:#3d2410}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 Cairo,Tahoma,Arial,sans-serif}
#app{max-width:1180px;margin:auto;padding:14px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.bar{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:12px}
h1{margin:0;font-size:22px}h2{margin:0 0 12px;font-size:16px}.mut{color:var(--mut);margin:0}
.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.emp{display:flex;gap:12px;align-items:center}.av{width:52px;height:52px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.emp b{font-size:16px}.emp small{display:block;color:var(--mut)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:var(--bg);border-radius:10px;padding:10px}.kv small{color:var(--mut);display:block;font-size:12px}.kv b{font-size:16px}
.big{border:2px solid var(--pr)}.clock{font-size:34px;font-weight:700;color:var(--pr);margin:0 0 10px}
button,select,input{font:inherit;color:var(--tx)}
select,input{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
button{border:0;border-radius:9px;padding:10px 18px;cursor:pointer;font-weight:600}
.pri{background:var(--pr);color:#fff}.pri:disabled,.dan:disabled{opacity:.4;cursor:not-allowed}.dan{background:var(--er);color:#fff}.sec{background:var(--grs);color:var(--tx)}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}.big .act button{padding:12px 26px;font-size:15px}
.sub{margin-top:14px;padding-top:14px;border-top:1px dashed var(--bd)}
.b{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok{background:var(--oks);color:var(--ok)}.s-wa{background:var(--was);color:var(--wa)}.s-er{background:var(--ers);color:var(--er)}.s-in{background:var(--ins);color:var(--in)}.s-gr{background:var(--grs);color:var(--gr)}.s-or{background:var(--ors);color:var(--or)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat small{color:var(--mut);display:block}.stat b{font-size:18px}
.sh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}.sh h2{margin:0}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}.fl label{font-size:12px;color:var(--mut);display:block}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th{background:var(--bg);font-size:12px;color:var(--mut)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;color:#fff;display:none;z-index:9}
.edit{display:none;gap:8px;margin-top:10px;grid-template-columns:1fr 1fr 1fr}.edit.on{display:grid}
@media(max-width:800px){.grid2{grid-template-columns:1fr}.clock{font-size:28px}}
#printArea{display:none}
.set{min-width:0}.set h3{margin:0 0 10px;font-size:14px}.set .fl{margin-bottom:12px}.set label.l{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.days{display:flex;gap:6px;flex-wrap:wrap}.days label{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}.days input{width:auto;padding:0}
.cur{background:var(--bg);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:13px}
.rp{background:#fff;color:#111;font-family:Cairo,Tahoma,sans-serif;font-size:11px}.rp h1{font-size:20px;margin:0}.rp .rh{display:flex;justify-content:space-between;border-bottom:3px solid #2456d6;padding-bottom:8px;margin-bottom:10px}
.rp .ec{border:1px solid #cfd6e4;border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}.rp .ec small{color:#667085;display:block}
.rp .sc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.rp .sc div{background:#eef3fd;border-radius:8px;padding:6px 8px}.rp .sc small{display:block;color:#556}.rp .sc b{font-size:13px}
.rp table{min-width:0}.rp th{background:#2456d6;color:#fff}.rp td{border-bottom:1px solid #dde2ec;padding:5px 6px;color:#111}.rp tr{break-inside:avoid}.rp thead{display:table-header-group}
.rp .tot{margin-top:10px;padding:8px;background:#eef3fd;border-radius:8px;font-weight:700}
.rp .ft{position:fixed;bottom:0;left:0;right:0;font-size:9px;color:#667085;display:flex;justify-content:space-between;border-top:1px solid #ccd}
#cf{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}#cf>div{background:var(--card,#fff);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}#cf p{margin:0 0 16px;line-height:1.7}#cf .act{margin:0;justify-content:flex-start}
@media print{#cf{display:none!important}@page{size:A4;margin:12mm 12mm 16mm;@bottom-center{content:"صفحة " counter(page) " من " counter(pages);font:9px Cairo,sans-serif;color:#667085}}
#app,#toast{display:none!important}#printArea{display:block}body{background:#fff}}
</style></head><body>
<div id="app">
 <div class="grid2"><section class="card big" id="today"></section><section class="card" id="shift"></section></div>
 <section>
  <div class="sh"><h2>📊 ملخص الشهر — <span id="mLabel"></span></h2><div style="display:flex;gap:8px"><input type="month" id="mSum" style="width:auto"><button class="pri" id="btnPdf">📄 تصدير تقرير PDF</button></div></div>
  <div class="stats" id="stats"></div>
 </section>
<section class="card"><h2>📋 سجل الحضور والانصراف</h2><div class="tw"><table><thead><tr><th>اليوم</th><th>التاريخ</th><th>حضور</th><th>انصراف</th><th>ساعات العمل</th><th>التأخير</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
<section class="card set" id="settings" hidden></section>
</div>
<div id="printArea"></div><div id="toast"></div>
<script>
/* ===== Utils ===== */
const pad=n=>String(n).padStart(2,'0');
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const tm=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const t12=m=>{if(m==null)return'—';let h=Math.floor(m/60),s=h>=12?'م':'ص';h=h%12||12;return`${pad(h)}:${pad(m%60)} ${s}`};
const t24=m=>m==null?'—':`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const hm=m=>m==null?'—':`${Math.floor(m/60)}:${pad(m%60)}`;
const dur=m=>{const h=Math.floor(m/60),r=m%60;return`${h} ساعة`+(r?` و${r} دقيقة`:'')};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const isWeekend=d=>[5,6].includes(d.getDay());          // الجمعة والسبت (الافتراضي القديم)
const DEF_DAYS=[0,1,2,3,4];                             // أيام العمل الافتراضية لو الشيفت مفيهوش days
const daysOf=s=>Array.isArray(s&&s.days)&&s.days.length?s.days:DEF_DAYS;
const isOffDate=(d,shift)=>!daysOf(shift).includes(d.getDay()); // خارج أيام عمل الموظف
let Holidays=[];                                       // عطلات رسمية 'YYYY-MM-DD'
const rnd=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296};

/* ===== Employee & Shift data (تُحمَّل من الخادم) ===== */
let EmployeeData=[],ShiftData={};
const emp=id=>EmployeeData.find(e=>e.id===id);

/* ===== Store + Permissions ===== */
const Store={rec:{},get(id,k){return this.rec[id+'|'+k]},set(id,k,v){this.rec[id+'|'+k]=v}};
const state={userId:'EMP-001',viewId:'EMP-001',month:'',f:{from:'',to:'',status:'',dept:''}};
const user=()=>emp(state.userId);
async function updateShift(id,v){ // تعديل الشيفت: متاح لكل المستخدمين
 if(!(v.end>v.start))return{ok:false,msg:'وقت النهاية يجب أن يكون بعد البداية'};
 if(isNaN(v.grace)||v.grace<0||v.grace>120)return{ok:false,msg:'فترة السماح غير منطقية (0–120)'};
 try{ShiftData[id]=await api('/shifts/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(v)});return{ok:true}}catch(e){return{ok:false,msg:e.message}}}

/* ===== Attendance Logic ===== */
function calculateLateMinutes(inM,shift){return(inM==null||!shift)?0:Math.max(0,inM-(shift.start+shift.grace))}
function calculateWorkingHours(inM,outM){return(inM==null||outM==null||outM<=inM)?null:outM-inM}
function getDayStatus(date,rec,shift,today){
 const k=dkey(date);
 if(isOffDate(date,shift)||Holidays.includes(k))return'عطلة';
 if(rec&&rec.leave)return'إجازة';
 if(rec&&rec.in!=null){
  if(rec.out==null&&k<dkey(today))return'حضور بدون انصراف';
  return calculateLateMinutes(rec.in,shift)>0?'متأخر':'حاضر'}
 return k<dkey(today)?'غائب':'لم يسجل بعد'}
function buildRows(id,y,m,today=new Date()){
 const sh=ShiftData[id],rows=[],n=new Date(y,m+1,0).getDate();
 for(let d=1;d<=n;d++){
  const date=new Date(y,m,d);if(dkey(date)>dkey(today))break;
  const r=Store.get(id,dkey(date)),status=getDayStatus(date,r,sh,today),has=r&&r.in!=null;
  rows.push({date,k:dkey(date),day:DAYS[date.getDay()],start:sh?sh.start:null,in:has?r.in:null,out:has?r.out:null,hours:has?calculateWorkingHours(r.in,r.out):null,late:has?calculateLateMinutes(r.in,sh):null,status})}
 return rows}
function calculateMonthlySummary(id,y,m,today=new Date()){
 const rows=buildRows(id,y,m,today),n=new Date(y,m+1,0).getDate(),sh=ShiftData[id];let work=0;
 for(let d=1;d<=n;d++){const dt=new Date(y,m,d);if(!isOffDate(dt,sh)&&!Holidays.includes(dkey(dt)))work++}
 const c=s=>rows.filter(r=>r.status===s).length,lateRows=rows.filter(r=>r.late>0),tl=lateRows.reduce((a,r)=>a+r.late,0);
 return{workDays:work,present:rows.filter(r=>r.in!=null).length,absent:c('غائب'),leave:c('إجازة'),lateDays:lateRows.length,lateTotal:tl,lateAvg:lateRows.length?Math.round(tl/lateRows.length):0,hours:rows.reduce((a,r)=>a+(r.hours||0),0),rows}}

/* ===== API (الخادم هو المرجع: الوقت والصلاحيات) ===== */
let USER=null;   // المستخدم الحالي بييجي من الجلسة (تسجيل الدخول)
async function api(path,opts={}){
 const res=await fetch('/api'+path,{...opts,headers:{'Content-Type':'application/json'}});
 const j=await res.json().catch(()=>({}));
 if(res.status===401){location.reload();throw new Error(j.error||'انتهت الجلسة')}
 if(res.status===404&&j.error==='غير موجود'&&opts.method==='DELETE')throw new Error('الخادم شغال بنسخة قديمة — أوقفه (Ctrl+C) وشغّله تاني بالأمر: node server.js');
 if(!res.ok)throw new Error(j.error||'تعذّر الاتصال بالخادم');
 return j}
async function loadRecords(){
 const id=state.viewId,n=new Date(),cur=`${n.getFullYear()}-${pad(n.getMonth()+1)}`,months=[...new Set([cur,state.month])];
 const recs=await api(`/attendance?employee_id=${encodeURIComponent(id)}&months=${months.join(',')}`);
 Object.keys(Store.rec).forEach(k=>{if(k.startsWith(id+'|'))delete Store.rec[k]});
 recs.forEach(r=>Store.set(id,r.date,r.leave?{leave:true}:{in:r.in,out:r.out}))}
async function refresh(){try{await loadRecords();render()}catch(e){toast(e.message,'er')}}
async function init(){
 try{const b=await api('/bootstrap');
  EmployeeData=b.employees;USER=b.employees[0].id;ShiftData=b.shifts;Holidays=b.holidays;
  state.userId=state.viewId=USER;const n=new Date();state.month=`${n.getFullYear()}-${pad(n.getMonth()+1)}`;
  await refresh();
  try{await loadSettings();renderSettings()}catch(e){toast(e.message,'er')}}
 catch(e){if(e.message==='المستخدم غير معروف'){try{const c=(await(await fetch('/api/setup')).json()).count;if(c===0)return showSetup('👥 إضافة موظفين')}catch{}}
  $('app').innerHTML='<div class="card"><h2>⚠️ تعذّر تحميل البيانات</h2><p class="mut">'+e.message+'</p><p class="mut">شغّل الخادم بالأمر: node server.js ثم افتح http://localhost:3000</p></div>'}}

/* ===== Report (PDF عبر طباعة المتصفح بتنسيق A4) ===== */
function generateAttendanceReport(id,y,m){
 const e=emp(id),sh=ShiftData[id],s=calculateMonthlySummary(id,y,m),lbl=`${MONTHS[m]} ${y}`;
 const rows=s.rows.map(r=>`<tr><td>${pad(r.date.getDate())}/${pad(m+1)}/${y}</td><td>${r.day}</td><td>${t24(r.start)}</td><td>${t24(r.in)}</td><td>${t24(r.out)}</td><td>${hm(r.hours)}</td><td>${r.late==null?'—':r.late+' دقيقة'}</td><td>${r.status}</td></tr>`).join('');
 const cell=(a,b)=>`<div><small>${a}</small><b>${b}</b></div>`;
 return`<div class="rp"><div class="rh"><div><h1>تقرير الحضور والانصراف الشهري</h1><div>${lbl}</div></div><div style="text-align:left"><b>نظام ERP</b><br>وحدة الحضور وتتبع الوقت</div></div>
 <div class="ec">${cell('اسم الموظف',e.name)}${cell('الرقم الوظيفي',e.id)}${cell('القسم',e.dept)}${cell('الوظيفة',e.job)}${cell('الشهر',lbl)}${cell('الشيفت',sh?`${t12(sh.start)} - ${t12(sh.end)} (سماح ${sh.grace} د)`:'غير محدد')}</div>
 <div class="sc">${cell('إجمالي أيام العمل',s.workDays)}${cell('أيام الحضور',s.present)}${cell('أيام الغياب',s.absent)}${cell('أيام الإجازة',s.leave)}${cell('أيام التأخير',s.lateDays)}${cell('إجمالي دقائق التأخير',s.lateTotal)}${cell('متوسط التأخير',s.lateAvg+' دقيقة')}${cell('إجمالي ساعات العمل',dur(s.hours))}</div>
 <table><thead><tr><th>التاريخ</th><th>اليوم</th><th>بداية الشيفت</th><th>الحضور</th><th>الانصراف</th><th>ساعات العمل</th><th>التأخير</th><th>الحالة</th></tr></thead><tbody>${rows}</tbody></table>
 <div class="tot">إجمالي التأخير خلال الشهر: ${s.lateTotal} دقيقة<br>إجمالي ساعات العمل: ${dur(s.hours)}</div>
 <div class="ft"><span>تاريخ إنشاء التقرير: ${new Date().toLocaleString('ar-EG')}</span><span>سري — للاستخدام الداخلي مع الموارد البشرية</span></div></div>`}
function exportPDF(){
 const[y,m]=state.month.split('-').map(Number);
 document.getElementById('printArea').innerHTML=generateAttendanceReport(state.viewId,y,m-1);
 try{window.print()}catch(e){toast('تعذّر فتح نافذة الطباعة من هذه الصفحة','er')}}

/* ===== UI ===== */
const $=id=>document.getElementById(id);
const CLS={'حاضر':'s-ok','متأخر':'s-wa','غائب':'s-er','إجازة':'s-in','عطلة':'s-gr','حضور بدون انصراف':'s-or','لم يسجل بعد':'s-gr'};
const badge=s=>`<span class="b ${CLS[s]}">${s}</span>`;
const lateBadge=l=>`<span class="b ${l==0?'s-ok':l<=15?'s-wa':'s-er'}">${l} دقيقة</span>`;
function toast(t,type){const el=$('toast');el.textContent=t;el.style.background=type==='er'?'#c22b3a':'#12805c';el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2800)}
function ask(msg){return new Promise(ok=>{ // نافذة تأكيد داخل الصفحة (confirm() بتاعة المتصفح ممكن تتحجب)
 const d=document.createElement('div');d.id='cf';d.innerHTML=`<div role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="act"><button class="dan" id="cfY">🗑️ نعم، امسح</button><button class="sec" id="cfN">إلغاء</button></div></div>`;
 const done=v=>{d.remove();document.removeEventListener('keydown',kd);ok(v)},kd=e=>{if(e.key==='Escape')done(false)};
 d.onclick=e=>{if(e.target===d)done(false)};document.addEventListener('keydown',kd);
 document.body.appendChild(d);d.querySelector('#cfY').onclick=()=>done(true);d.querySelector('#cfN').onclick=()=>done(false);d.querySelector('#cfN').focus()})}
const canAct=()=>state.viewId===state.userId;

async function checkIn(){
 if(!canAct())return toast('لا يمكنك تسجيل حضور موظف آخر','er');
 try{await api('/attendance/check-in',{method:'POST'});toast('تم تسجيل الحضور بنجاح');await refresh()}catch(e){toast(e.message,'er')}}
async function checkOut(){
 if(!canAct())return toast('لا يمكنك تسجيل انصراف موظف آخر','er');
 try{await api('/attendance/check-out',{method:'POST'});toast('تم تسجيل الانصراف بنجاح');await refresh()}catch(e){toast(e.message,'er')}}
function renderShift(){const id=state.viewId,s=ShiftData[id],b=s||{start:480,end:960,grace:15};
 $('shift').innerHTML=`<h2>⏱️ شيفت الموظف</h2>${s?`<div class="kv"><div><small>بداية الشيفت</small><b>${t12(s.start)}</b></div><div><small>نهاية الشيفت</small><b>${t12(s.end)}</b></div><div><small>مدة العمل</small><b>${dur(s.end-s.start)}</b></div><div><small>فترة السماح</small><b>${s.grace} دقائق</b></div></div>
 <p class="mut" style="margin-top:8px;font-size:12px">آخر وقت بدون تأخير: ${t12(s.start+s.grace)}</p>`:'<p class="mut" style="margin:8px 0">لا يوجد شيفت مطبق على هذا الموظف — لن يُحسب تأخير. يمكنك تحديد شيفت من هنا أو من الإعدادات.</p>'}
 <div class="act"><button class="sec" id="bEdit">${s?'✏️ تعديل الشيفت':'➕ تحديد شيفت'}</button></div><div class="edit" id="editBox"><div><label class="mut">البداية</label><input type="time" id="eS" value="${t24(b.start)}"></div><div><label class="mut">النهاية</label><input type="time" id="eE" value="${t24(b.end)}"></div><div><label class="mut">السماح (د)</label><input type="number" id="eG" value="${b.grace}"></div><button class="pri" id="bSave" style="grid-column:1/-1">حفظ</button></div>`;
 $('bEdit').onclick=()=>$('editBox').classList.toggle('on');
 $('bSave').onclick=async()=>{const res=await updateShift(id,{start:tm($('eS').value||'0:0'),end:tm($('eE').value||'0:0'),grace:+$('eG').value});
  if(!res.ok)return toast(res.msg,'er');toast('تم حفظ الشيفت');if(SettingsData.employees.length)await loadSettings();render();renderSettings()}}
function renderToday(){
 const now=new Date(),id=state.viewId,sh=ShiftData[id],k=dkey(now),r=Store.get(id,k),has=r&&r.in!=null;
 const st=getDayStatus(now,r,sh,now),late=has?calculateLateMinutes(r.in,sh):0,own=canAct();
 const off=st==='عطلة'||st==='إجازة';
 $('today').innerHTML=`<h2>✅ تسجيل حضور اليوم</h2><p class="clock" id="clk">--:--:--</p>
 <div class="kv"><div><small>📅 التاريخ</small><b>${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}</b></div><div><small>اليوم</small><b>${DAYS[now.getDay()]}</b></div><div><small>وقت بداية الشيفت</small><b>${sh?t12(sh.start):'—'}</b></div><div><small>وقت الحضور الفعلي</small><b>${has?t12(r.in):'—'}</b></div><div><small>حالة الحضور</small>${badge(st)}</div><div><small>التأخير</small>${has?lateBadge(late):'<b>—</b>'}</div></div>
 <div class="act"><button class="pri" id="bIn" ${(has||!own||off)?'disabled':''}>🟢 تسجيل الحضور</button>${has?`<span>وقت الحضور: <b>${t12(r.in)}</b></span>`:''}${own?'':'<span class="mut">👁️ عرض فقط — التسجيل لحسابك الشخصي</span>'}</div>
 ${has?`<div class="sub"><h2>🚪 تسجيل الانصراف</h2><div class="kv"><div><small>وقت الحضور</small><b>${t12(r.in)}</b></div><div><small>وقت الانصراف</small><b>${r.out!=null?t12(r.out):'—'}</b></div><div><small>إجمالي ساعات العمل</small><b>${r.out!=null?dur(calculateWorkingHours(r.in,r.out)):'لم يتم تسجيل الانصراف'}</b></div></div><div class="act"><button class="dan" id="bOut" ${(r.out!=null||!own)?'disabled':''}>🔴 تسجيل الانصراف</button></div></div>`:''}`;
 $('bIn').onclick=checkIn;if($('bOut'))$('bOut').onclick=checkOut;tick()}
function tick(){const c=$('clk');if(c)c.textContent=new Date().toLocaleTimeString('en-GB')}
setInterval(tick,1000);

function renderSummary(){
 const[y,m]=state.month.split('-').map(Number),s=calculateMonthlySummary(state.viewId,y,m-1);
 $('mLabel').textContent=`${MONTHS[m-1]} ${y}`;$('mSum').value=state.month;
 const it=[['📆','إجمالي أيام العمل',s.workDays+' يوم'],['✅','أيام الحضور',s.present+' يوم'],['❌','أيام الغياب',s.absent+' يوم'],['🌴','أيام الإجازة',s.leave+' يوم'],['⏰','أيام التأخير',s.lateDays+' أيام'],['⌛','إجمالي دقائق التأخير',s.lateTotal+' دقيقة'],['📉','متوسط التأخير',s.lateAvg+' دقيقة'],['🕓','إجمالي ساعات العمل',dur(s.hours)]];
 $('stats').innerHTML=it.map(a=>`<div class="stat"><small>${a[0]} ${a[1]}</small><b>${a[2]}</b></div>`).join('')}
function renderTable(){
 const[y,m]=state.month.split('-').map(Number),f=state.f;
 let rows=buildRows(state.viewId,y,m-1).filter(r=>(!f.from||r.k>=f.from)&&(!f.to||r.k<=f.to)&&(!f.status||r.status===f.status)).reverse();
 $('tbody').innerHTML=rows.length?rows.map(r=>`<tr><td>${r.day}</td><td>${pad(r.date.getDate())}/${pad(m)}/${y}</td><td>${t12(r.in)}</td><td>${r.in!=null&&r.out==null?'<span class="mut">لم يُسجل</span>':t12(r.out)}</td><td>${hm(r.hours)}</td><td>${r.late==null?'—':lateBadge(r.late)}</td></tr>`).join(''):'<tr><td colspan="6" class="mut" style="text-align:center">لا توجد سجلات مطابقة</td></tr>'}
function render(){renderToday();renderShift();renderSummary();renderTable()}

/* ===== ⚙️ الإعدادات — شيفت كل موظف + مسح البيانات (متاحة لكل المستخدمين) ===== */
const WEEK_ORDER=[6,0,1,2,3,4,5];                       // ترتيب عرض الأيام: من السبت للجمعة
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SettingsData={employees:[],shifts:{}};
const dayNames=s=>WEEK_ORDER.filter(d=>daysOf(s).includes(d)).map(d=>DAYS[d]).join('، ');
async function loadSettings(){
 SettingsData=await api('/settings/shifts');}
function renderSettings(){
 const box=$('settings');
 box.hidden=false;
 const E=SettingsData.employees,S=SettingsData.shifts;
 const me=EmployeeData[0];
 box.innerHTML=`<h2>⚙️ الإعدادات</h2>
 <div class="sub"><h3>👤 حسابي — ${esc(me.name)} (${esc(me.id)})</h3><div class="fl">
  <div><label class="l" for="pCur">كلمة السر الحالية</label><input id="pCur" type="password" autocomplete="current-password"></div>
  <div><label class="l" for="pNew">كلمة السر الجديدة (6 أحرف على الأقل)</label><input id="pNew" type="password" autocomplete="new-password"></div>
  <div><label class="l" for="pNew2">تأكيد كلمة السر الجديدة</label><input id="pNew2" type="password" autocomplete="new-password"></div></div>
  <div class="act" style="margin:10px 0 0"><button class="pri" id="pSave">🔑 تغيير كلمة السر</button><button id="logout">🚪 تسجيل الخروج</button></div></div>
 <div class="sub"><h3>➕ إضافة موظف</h3>${empForm()}</div>
 <div class="sub"><h3>الشيفت المطبق على كل موظف</h3><div class="tw"><table><thead><tr><th>الموظف</th><th>الرقم الوظيفي</th><th>القسم</th><th>البداية</th><th>النهاية</th><th>أيام العمل</th><th>السماح</th><th>كلمة السر</th><th></th></tr></thead>
 <tbody>${E.map(e=>{const s=S[e.id];return`<tr><td>${esc(e.name)}</td><td>${esc(e.id)}</td><td>${esc(e.dept)}</td>${s?`<td>${t12(s.start)}</td><td>${t12(s.end)}</td><td>${dayNames(s)}</td><td>${s.grace} د</td>`:'<td colspan="4" class="mut">لا يوجد شيفت</td>'}<td style="white-space:nowrap"><input type="password" data-pw="${esc(e.id)}" placeholder="جديدة" autocomplete="new-password" style="width:90px"> <button data-setpw="${esc(e.id)}">تعيين</button></td><td style="white-space:nowrap">${s?`<button class="dan" data-clr="${esc(e.id)}">🗑️ مسح الشيفت</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div>
 <div class="sub"><h3>🗑️ مسح البيانات</h3><p class="mut" style="font-size:13px;margin:0 0 10px">إجراءات نهائية على كل الموظفين المسجلين (${E.length} موظف). بيتعمل نسخة احتياطية قبل المسح في data/db.json.bak (آخر نسخة بس).</p>
 <div class="act" style="margin:0"><button class="dan" id="wAtt">🗑️ مسح سجلات الحضور والانصراف لكل الموظفين</button><button class="dan" id="wShift">🗑️ مسح الشيفت المطبق على كل الموظفين</button><button class="dan" id="wEmp">🗑️ مسح كل الموظفين المسجلين</button></div></div>`;
 $('pSave').onclick=changeMyPassword;$('logout').onclick=logout;
 box.querySelectorAll('[data-setpw]').forEach(b=>b.onclick=()=>setEmpPassword(b.dataset.setpw));
 $('nAdd').onclick=()=>addEmployee(false);$('wAtt').onclick=wipeAttendance;$('wShift').onclick=wipeAllShifts;$('wEmp').onclick=wipeEmployees;
 box.querySelectorAll('[data-clr]').forEach(b=>b.onclick=()=>clearShift(b.dataset.clr));}

async function wipeAttendance(){
 if(!await ask('هتمسح كل سجلات الحضور والانصراف لكل الموظفين. الإجراء ده نهائي. متأكد؟'))return;
 try{const r=await api('/settings/attendance',{method:'DELETE'});Store.rec={};toast(`تم مسح ${r.removed} سجل حضور`);await refresh()}
 catch(e){toast(e.message,'er')}}
async function changeMyPassword(){
 const cur=$('pCur').value,n=$('pNew').value;
 if(!cur)return toast('اكتب كلمة السر الحالية','er');
 if(n.length<6)return toast('كلمة السر الجديدة لازم تكون 6 أحرف على الأقل','er');
 if(n!==$('pNew2').value)return toast('كلمتا السر غير متطابقتين','er');
 try{await api('/me/password',{method:'POST',body:JSON.stringify({current:cur,next:n})});
  ['pCur','pNew','pNew2'].forEach(i=>$(i).value='');toast('تم تغيير كلمة السر')}
 catch(e){toast(e.message,'er')}}
async function setEmpPassword(id){
 const inp=document.querySelector(`[data-pw="${CSS.escape(id)}"]`);
 if(inp.value.length<6){inp.focus();return toast('كلمة السر لازم تكون 6 أحرف على الأقل','er')}
 try{await api(`/settings/employees/${encodeURIComponent(id)}/password`,{method:'POST',body:JSON.stringify({password:inp.value})});
  inp.value='';toast('تم تعيين كلمة السر للموظف')}
 catch(e){toast(e.message,'er')}}
async function logout(){try{await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}catch{}location.reload()}
function empForm(){return`<div class="fl"><div><label class="l" for="nName">اسم الموظف</label><input id="nName" type="text" maxlength="80" autocomplete="off"></div>
 <div><label class="l" for="nDept">القسم (اختياري)</label><input id="nDept" type="text" maxlength="80" autocomplete="off"></div>
 <div><label class="l" for="nJob">الوظيفة (اختياري)</label><input id="nJob" type="text" maxlength="80" autocomplete="off"></div>
 <div><label class="l" for="nPass">كلمة السر (6 أحرف على الأقل)</label><input id="nPass" type="password" minlength="6" autocomplete="new-password"></div></div>
 <div class="act" style="margin:10px 0 0"><button class="pri" id="nAdd">➕ إضافة موظف</button></div>`}
function showSetup(title){$('app').innerHTML=`<div class="card"><h2>${title}</h2><p class="mut">مفيش موظفين مسجلين. أضف أول موظف عشان تبدأ:</p>${empForm()}</div>`;$('nAdd').onclick=()=>addEmployee(true)}
async function addEmployee(setup){
 const name=$('nName').value.trim();
 if(name.length<2){$('nName').focus();return toast('اكتب اسم الموظف (حرفين على الأقل)','er')}
 if($('nPass').value.length<6){$('nPass').focus();return toast('كلمة السر لازم تكون 6 أحرف على الأقل','er')}
 const btn=$('nAdd');btn.disabled=true;
 try{
  const r=await api('/settings/employees',{method:'POST',body:JSON.stringify({name,dept:$('nDept').value,job:$('nJob').value,password:$('nPass').value})});
  if(setup){location.reload();return}
  toast(`تمت إضافة ${r.name} (${r.id})`);await loadSettings();renderSettings()}
 catch(e){toast(e.message,'er');btn.disabled=false}}
function askTyped(msg,word){return new Promise(ok=>{ // تأكيد بالكتابة للإجراءات الخطيرة
 const d=document.createElement('div');d.id='cf';d.innerHTML=`<div role="dialog" aria-modal="true"><p>${esc(msg)}</p><p style="margin-bottom:8px">اكتب <b>${esc(word)}</b> للتأكيد:</p><input id="cfT" type="text" autocomplete="off" style="width:100%;margin-bottom:14px"><div class="act"><button class="dan" id="cfY" disabled>🗑️ نعم، امسح</button><button class="sec" id="cfN">إلغاء</button></div></div>`;
 const done=v=>{d.remove();document.removeEventListener('keydown',kd);ok(v)},kd=e=>{if(e.key==='Escape')done(false)};
 d.onclick=e=>{if(e.target===d)done(false)};document.addEventListener('keydown',kd);document.body.appendChild(d);
 const inp=d.querySelector('#cfT'),y=d.querySelector('#cfY');
 inp.oninput=()=>{y.disabled=inp.value.trim()!==word};y.onclick=()=>done(true);d.querySelector('#cfN').onclick=()=>done(false);inp.focus()})}
async function wipeEmployees(){
 const n=SettingsData.employees.length;
 if(!await askTyped(`هتمسح كل الموظفين المسجلين (${n} موظف) مع الشيفتات وسجلات الحضور بتاعتهم. بعدها التطبيق مش هيشتغل لحد ما ترجّع النسخة الاحتياطية.`,'مسح الكل'))return;
 try{
  const r=await api('/settings/employees',{method:'DELETE'});
  $('app').innerHTML=`<div class="card"><h2>✅ تم مسح كل الموظفين (${r.removed})</h2><p class="mut">اتعملت نسخة احتياطية في <b dir="ltr">${esc(r.backup)}</b></p><p class="mut">للتراجع: أوقف الخادم، انسخ الملف ده فوق <b dir="ltr">data/db.json</b>، وشغّل <b dir="ltr">node server.js</b> تاني.</p><h3>➕ إضافة موظف جديد</h3>${empForm()}</div>`;$('nAdd').onclick=()=>addEmployee(true);
  const st=$('settings');if(st)st.hidden=true}
 catch(e){toast(e.message,'er')}}
async function afterShiftChange(){await loadSettings();render();renderSettings()}
async function wipeAllShifts(){
 if(!await ask('هتمسح الشيفت المطبق على كل الموظفين. متأكد؟'))return;
 try{await api('/settings/shifts',{method:'DELETE'});ShiftData={};toast('تم مسح الشيفت لكل الموظفين');await afterShiftChange()}
 catch(e){toast(e.message,'er')}}
async function clearShift(id){
 const e=emp(id)||SettingsData.employees.find(x=>x.id===id);
 if(!await ask(`هتمسح الشيفت المطبق على ${e?e.name:id}. متأكد؟`))return;
 try{await api('/shifts/'+encodeURIComponent(id),{method:'DELETE'});delete ShiftData[id];toast('تم مسح الشيفت');await afterShiftChange()}
 catch(err){toast(err.message,'er')}}

/* ===== Events ===== */
$('mSum').onchange=e=>{if(e.target.value){state.month=e.target.value;refresh()}};
$('btnPdf').onclick=exportPDF;
init();
</script></body></html>
